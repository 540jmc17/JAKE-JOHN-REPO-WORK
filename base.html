<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CampusGear helps students discover campus equipment and staff manage shared resources.">
  <title>{% block title %}CampusGear{% endblock %} | CampusGear</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ url_for('site.home') }}" aria-label="CampusGear home">
        <span class="brand-mark" aria-hidden="true">CG</span>
        <span>Campus<span class="brand-accent">Gear</span></span>
      </a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="{{ url_for('site.home') }}" class="nav-link{% if active_page == 'home' %} is-active{% endif %}"{% if active_page == 'home' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ url_for('site.catalog') }}" class="nav-link{% if active_page == 'catalog' %} is-active{% endif %}"{% if active_page == 'catalog' %} aria-current="page"{% endif %}>Equipment Catalog</a>
        <a href="{{ url_for('site.about') }}" class="nav-link{% if active_page == 'about' %} is-active{% endif %}"{% if active_page == 'about' %} aria-current="page"{% endif %}>About</a>
      </nav>

      {% block account_actions %}
        {# Requirement #5 may replace this with authenticated account actions. #}
        <a class="button button-small button-outline" href="{{ url_for('site.login') }}"{% if active_page == 'login' %} aria-current="page"{% endif %}>Sign in</a>
      {% endblock %}
    </div>
  </header>

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span><strong>CampusGear</strong> &middot; Team 18</span>
      <span>Built for the campus community</span>
    </div>
  </footer>
</body>
</html>
